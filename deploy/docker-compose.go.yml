version: '3.8'

# Go 版与 Python 版并行双跑用的 compose 样例：数据目录 ./data-go 完全独立，
# 两边各自的账号库/任务/媒体互不干扰，验证通过后再决定切流量还是长期并存。
# 宿主端口（这里是 8080）随你挑，只要不与其他服务撞；容器内固定监听 18610。
#
# 构建：Dockerfile 是两阶段的（builder 用官方 golang 镜像编译，运行时只留二进制 + chromium），
# 所以上下文就是仓库根，不需要预先编译任何东西：
#   git clone <本仓库> && cd <本仓库> && docker compose -f deploy/docker-compose.go.yml up -d --build
# 密钥放旁边一份 .env（600 权限）写 MUSE2API_KEY=…；若与 Python 版共用同一把密钥，
# 客户端只改端口就够用，且重建容器也不会再换 key。
#
# 想把现有账号带过来（cookie 快照导入，两边 accounts.json 的格式是同一套）：
#   docker cp <python容器>:/app/data/accounts.json ./data-go/accounts.json
#   docker compose -f deploy/docker-compose.go.yml restart   # 导入前先停一次，别让两边保活同时续签同一批 cookie
services:
  muse2api-go:
    build:
      context: .
      dockerfile: Dockerfile
    image: muse2api-go:1.6.1
    container_name: muse2api-go
    restart: unless-stopped
    # init: true —— 让 docker 自带的最小 init 当 PID 1 负责收尸。
    # Go 进程自己是 PID 1 时会收养 chromium 孤儿化的子孙进程，而代码只 Wait() 自己那个直接子进程；
    # 每「起一次浏览器再释放」就会攒下一排僵尸进程（实测一次循环留下 8 个）。
    init: true
    ports:
      - "8080:18610"
    environment:
      # 留空则首次启动自动生成一把写进 data-go/.env（与 Python 版同一条路径）
      - MUSE2API_KEY=${MUSE2API_KEY:-}
      - MUSE2API_PUBLIC_BASE=
      - MUSE2API_IMAGE_TIMEOUT=240
      - MUSE2API_VIDEO_TIMEOUT=600
      - MUSE2API_CHAT_TIMEOUT=300
      # Go 版新增的几条（Python 没有）：空闲多久释放浏览器 / 要不要常驻热标签页 / 要不要打 access log
      - MUSE2API_BROWSER_IDLE_MINUTES=30
      - MUSE2API_WARM_TAB=0
      # 上游 1.6.0 起支持多账号并发生成，代码里的默认值与上游一致（2）。
      # 这份样例按"压内存"的目标钉成 1：多一路并发就多一个 renderer，而浏览器工作集
      # 本来就是内存大头。要跟上游完全一致就删掉这行（或改回 2）。
      - MUSE2API_CONCURRENCY=1
    volumes:
      - ./data-go:/app/data
    shm_size: '2gb' # Chromium 渲染大图时 /dev/shm 不够会直接崩，这条与 Python 版一致
    # 不加 mem_limit：空闲内存是靠「空闲释放浏览器」达成的，不是靠限制压出来的。
    # 限死了只会在生图高峰时把容器 OOM 掉，达不到验收口径也解释不了数据。
