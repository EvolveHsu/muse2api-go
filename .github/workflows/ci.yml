name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 金样本全在仓库里，回放测试不需要网络、不需要 Python、不需要 chromium —— CI 上就能全跑。
      # （录制是另一回事：那要一台跑着上游 Python 的实例，见 tools/golden/README.md。）
      - name: gofmt
        run: |
          bad=$(gofmt -l .)
          if [ -n "$bad" ]; then echo "未格式化：$bad"; exit 1; fi

      # -composites=false：internal/pyval 的有序对象字面量 `{"key", v}` 是刻意的写法（374 处），
      # 改成 keyed 会让每一处响应构造变成长噪声 —— 作为已知待办写在 README 的 CI 一节；其余 vet 检查必须干净。
      - name: vet
        run: go vet -composites=false ./...

      - name: test
        run: go test -count=1 ./...

      - name: build
        run: CGO_ENABLED=0 go build -trimpath ./...
